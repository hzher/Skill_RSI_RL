[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-rl-train"
version = "0.1.0"
description = "Train finite-action memory policies for native CL-Bench harnesses"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["skill_rsi_rl*"]

[tool.setuptools.package-data]
"skill_rsi_rl.harnesses" = ["configs/*.json", "plugins/clbench-submit/*", "LICENSE*"]
